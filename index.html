function renderAjustes(){
  const cfg = state.config;
  const marcasHtml = cfg.marcas.map((m,i)=>`<span class="tagchip">${escapeHtml(m)}<button data-act="rmmarca" data-i="${i}">✕</button></span>`).join('') || `<p class="muted">Nenhuma marca adicionada.</p>`;
  const instHtml = cfg.installments.map((it,i)=>`
    <div class="row" style="align-items:end; margin-bottom:8px;">
      <div class="field" style="margin-bottom:0;"><label>Vezes</label><input type="number" min="1" data-inst="vezes" data-i="${i}" value="${it.vezes}"></div>
      <div class="field" style="margin-bottom:0;"><label>Acréscimo (%)</label><input type="number" step="0.1" data-inst="percent" data-i="${i}" value="${it.percent}"></div>
      <button class="btn-danger btn-sm" data-act="rminst" data-i="${i}">✕</button>
    </div>`).join('');

  return `
  <div class="card">
    <div class="eyebrow">Aparência</div>
    <div class="field"><label>Tema do app</label>
      <select id="cfgTheme">
        ${Object.entries(THEMES).map(([key,t])=>`<option value="${key}" ${cfg.theme===key?'selected':''}>${t.label}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="card">
    <div class="eyebrow">Fornecedores</div>
    ${cfg.fornecedores.map((f,i)=>`<div class="row" style="margin-bottom:6px;"><input type="text" data-cfgfornecedor="${i}" value="${escapeHtml(f)}"><button class="btn-danger btn-sm" data-act="rmfornecedor" data-i="${i}">Remover</button></div>`).join('')}
    <button class="btn-secondary btn-block" data-act="addfornecedor">+ Adicionar fornecedor</button>
  </div>
  <div class="card">
    <div class="eyebrow">Parcelamento</div>
    <div class="field"><label>Parcela padrão do orçamento</label>
      <select id="cfgParceladoPadrao">
        ${cfg.installments.map((it,i)=>`<option value="${i}" ${cfg.parceladoPadraoIdx===i?'selected':''}>${it.vezes}x${it.percent?` (+${it.percent}%)`:''}</option>`).join('')}
      </select>
    </div>
    <p class="muted" style="margin-top:4px;">A taxa da parcela escolhida é embutida proporcionalmente no valor de cada item do orçamento (as opções de vezes/% ficam em "Tabelas de parcelamento" mais abaixo).</p>
  </div>
  <div class="card">
    <div class="eyebrow">Segurança</div>
    <div class="field"><label>Senha para entrar no app (deixe vazio para não usar senha)</label><input type="password" id="cfgSenha" value="${escapeHtml(cfg.password)}" placeholder="Senha"></div>
  </div>
  <div class="card">
    <div class="eyebrow">Empresa</div>
    <div class="field"><label>Nome da empresa</label><input type="text" id="cfgEmpresa" value="${escapeHtml(cfg.empresa)}"></div>
    <div class="field"><label>Seu nome (vendedor/responsável)</label><input type="text" id="cfgVendedor" value="${escapeHtml(cfg.vendedorNome)}" placeholder="Aparece no PDF"></div>
    <div class="row"><div class="field"><label>Telefone</label><input type="tel" id="cfgTel" value="${escapeHtml(cfg.telefone)}"></div><div class="field"><label>Cidade</label><input type="text" id="cfgCidade" value="${escapeHtml(cfg.cidade)}"></div></div>
    <div class="field"><label>Endereço completo</label><input type="text" id="cfgEndereco" value="${escapeHtml(cfg.endereco)}" placeholder="Rua, número, bairro, CEP"></div>
    <div class="field"><label>E-mail</label><input type="text" id="cfgEmail" value="${escapeHtml(cfg.email)}" placeholder="seuemail@exemplo.com"></div>
    <div class="field"><label>Logo</label><div id="logoPreviewWrap">${cfg.logoDataUrl?`<img ${'s'+'rc'}="${cfg.logoDataUrl}" class="imgpreview" style="max-width:90px;">`:''}</div><input type="file" accept="image/*" id="cfgLogoFile"></div>
  </div>
  <div class="card">
    <div class="eyebrow">Marcas representadas</div>
    <div class="taglist">${marcasHtml}</div>
    <div class="row"><input type="text" id="novaMarca" placeholder="Nome da marca"><button class="btn-secondary" id="addMarca">Adicionar</button></div>
  </div>
  <div class="card">
    <div class="eyebrow">PIX (aparece no PDF do orçamento)</div>
    <div class="field"><label>Chave PIX</label><input type="text" id="cfgPix" value="${escapeHtml(cfg.pix.chave)}" placeholder="Chave PIX"></div>
    <div class="field"><label>QR Code (opcional)</label><div id="qrPreviewWrap">${cfg.pix.qrDataUrl?`<img ${'s'+'rc'}="${cfg.pix.qrDataUrl}" class="imgpreview" style="max-width:120px;">`:''}</div><input type="file" accept="image/*" id="cfgQrFile"></div>
  </div>
  <div class="card">
    <div class="eyebrow">Tabelas de preço (até 3)</div>
    <p class="muted" style="margin-top:-4px;">Nomeie as colunas de preço do catálogo, ex: "À vista", "Parcelado".</p>
    ${cfg.priceLabels.map((l,i)=>`<div class="field"><label>Tabela ${i+1}</label><div class="row"><input type="text" data-cfgprice="${i}" value="${escapeHtml(l)}"> ${cfg.priceLabels.length>1?`<button class="btn-danger btn-sm" data-act="rmprice" data-i="${i}">Remover</button>`:''}</div></div>`).join('')}
    ${cfg.priceLabels.length<3?`<button class="btn-secondary btn-block" data-act="addprice">+ Adicionar tabela de preço</button>`:''}
  </div>
  <div class="card">
    <div class="eyebrow">Parcelamento (quantas vezes e acréscimo)</div>
    ${instHtml}
    <button class="btn-secondary btn-block" data-act="addinst">+ Adicionar opção de parcela</button>
  </div>
  <div class="card">
    <div class="eyebrow">Padrão de taxas (ajustável em cada orçamento)</div>
    <div class="row"><div class="field"><label>Taxa cartão</label><div class="row"><select id="cfgCardType"><option value="%" ${cfg.feeCardDefault.type==='%'?'selected':''}>%</option><option value="fixo" ${cfg.feeCardDefault.type==='fixo'?'selected':''}>R$</option></select><input type="number" step="0.01" id="cfgCardVal" value="${cfg.feeCardDefault.value}"></div></div></div>
    <div class="row"><div class="field"><label>Valor nota</label><div class="row"><select id="cfgNotaType"><option value="%" ${cfg.feeNotaDefault.type==='%'?'selected':''}>%</option><option value="fixo" ${cfg.feeNotaDefault.type==='fixo'?'selected':''}>R$</option></select><input type="number" step="0.01" id="cfgNotaVal" value="${cfg.feeNotaDefault.value}"></div></div></div>
  </div>
  <button class="btn-primary btn-block" data-act="savecfg">Salvar ajustes</button>
  <div class="card" style="margin-top:14px;">
    <div class="eyebrow">Backup de dados</div>
    <p class="muted" style="margin-top:-4px;">O backup do dia é obrigatório para abrir o app. Prefira o "backup completo" — é o que dá pra restaurar 100% se precisar.</p>
    <button class="btn-primary btn-block" data-act="exportarjson">📥 Baixar backup completo (para restaurar)</button>
    <button class="btn-secondary btn-block" data-act="exportarexcel" style="margin-top:8px;">📊 Exportar dados (Excel, leitura)</button>
    <div class="field" style="margin-top:14px; margin-bottom:0;"><label>Restaurar de um backup</label><input type="file" accept="application/json" id="cfgImportBackup"></div>
  </div>
  <p class="muted" style="text-align:center;margin-top:20px;">Dados salvos automaticamente. Use o mesmo link no celular e no notebook.</p>
  `;
}

/* ---------------- eventos genéricos ---------------- */
function wireOtherTabs(){
  const app = document.getElementById('app');
  if(state.tab==='produtos'){
    const s = app.querySelector('#prodSearch'); if(s) s.addEventListener('input', e=>{ prodFilter=e.target.value; document.getElementById('prodResultsWrap').innerHTML = prodRowsHtml(); wireProdRows(); });
    const nb = app.querySelector('[data-act=newprod]'); if(nb) nb.addEventListener('click', ()=>productModal(null));
    wireProdRows();
  }
  if(state.tab==='clientes'){
    const s = app.querySelector('#cliSearch'); if(s) s.addEventListener('input', e=>{ cliFilter=e.target.value; document.getElementById('cliResultsWrap').innerHTML = cliRowsHtml(); wireCliRows(); });
    const nb = app.querySelector('[data-act=newcli]'); if(nb) nb.addEventListener('click', ()=>clientModal(null));
    wireCliRows();
  }
  if(state.tab==='ajustes'){
    const cfgEnd = app.querySelector('#cfgEndereco'); if(cfgEnd) noAccentInput(cfgEnd);
    app.querySelectorAll('[data-cfgprice]').forEach(inp=> inp.addEventListener('input', e=>{ state.config.priceLabels[Number(inp.dataset.cfgprice)]=e.target.value; }));
    const addp = app.querySelector('[data-act=addprice]'); if(addp) addp.addEventListener('click', ()=>{
      if(state.config.priceLabels.length<3){ state.config.priceLabels.push('Tabela '+(state.config.priceLabels.length+1)); state.products.forEach(p=>{ while(p.prices.length<state.config.priceLabels.length) p.prices.push(0); }); render(); }
    });
    app.querySelectorAll('[data-act=rmprice]').forEach(btn=> btn.addEventListener('click', ()=>{ const i=Number(btn.dataset.i); state.config.priceLabels.splice(i,1); state.products.forEach(p=>p.prices.splice(i,1)); render(); }));

    app.querySelectorAll('[data-inst]').forEach(inp=> inp.addEventListener('input', e=>{
      const i = Number(inp.dataset.i); const field = inp.dataset.inst;
      state.config.installments[i][field] = field==='vezes' ? parseInt(e.target.value)||1 : parseNum(e.target.value);
    }));
    const addinst = app.querySelector('[data-act=addinst]'); if(addinst) addinst.addEventListener('click', ()=>{ state.config.installments.push({vezes:state.config.installments.length+1, percent:0}); render(); });
    app.querySelectorAll('[data-act=rminst]').forEach(btn=> btn.addEventListener('click', ()=>{ state.config.installments.splice(Number(btn.dataset.i),1); render(); }));

    const addMarcaBtn = app.querySelector('#addMarca'); if(addMarcaBtn) addMarcaBtn.addEventListener('click', ()=>{
      const inp = document.getElementById('novaMarca'); const v = inp.value.trim(); if(v){ state.config.marcas.push(v); inp.value=''; render(); }
    });
    app.querySelectorAll('[data-act=rmmarca]').forEach(btn=> btn.addEventListener('click', ()=>{ state.config.marcas.splice(Number(btn.dataset.i),1); render(); }));

    const logoFile = app.querySelector('#cfgLogoFile'); if(logoFile) logoFile.addEventListener('change', async e=>{
      if(!e.target.files[0]) return;
      try{
        state.config.logoDataUrl = await resizeImageFile(e.target.files[0], 320);
        document.getElementById('logoPreviewWrap').innerHTML = `<img ${'s'+'rc'}="${state.config.logoDataUrl}" class="imgpreview" style="max-width:90px;">`;
        toast('Logo carregada — clique em Salvar ajustes');
      }catch(err){ toast('Não consegui carregar essa imagem, tenta outra foto'); }
    });
    const qrFile = app.querySelector('#cfgQrFile'); if(qrFile) qrFile.addEventListener('change', async e=>{
      if(!e.target.files[0]) return;
      try{
        state.config.pix.qrDataUrl = await resizeImageFile(e.target.files[0], 320);
        document.getElementById('qrPreviewWrap').innerHTML = `<img ${'s'+'rc'}="${state.config.pix.qrDataUrl}" class="imgpreview" style="max-width:120px;">`;
        toast('QR Code carregado — clique em Salvar ajustes');
      }catch(err){ toast('Não consegui carregar essa imagem, tenta outra foto'); }
    });

    const themeSel = app.querySelector('#cfgTheme'); if(themeSel) themeSel.addEventListener('change', e=>{ applyTheme(e.target.value); });
    const addForn = app.querySelector('[data-act=addfornecedor]'); if(addForn) addForn.addEventListener('click', ()=>{ state.config.fornecedores.push('Novo fornecedor'); render(); });
    app.querySelectorAll('[data-cfgfornecedor]').forEach(inp=> inp.addEventListener('input', e=>{ state.config.fornecedores[Number(inp.dataset.cfgfornecedor)]=e.target.value; }));
    app.querySelectorAll('[data-act=rmfornecedor]').forEach(btn=> btn.addEventListener('click', ()=>{ state.config.fornecedores.splice(Number(btn.dataset.i),1); render(); }));

    const save = app.querySelector('[data-act=savecfg]'); if(save) save.addEventListener('click', async ()=>{
      state.config.empresa = document.getElementById('cfgEmpresa').value.trim();
      state.config.vendedorNome = document.getElementById('cfgVendedor').value.trim();
      state.config.telefone = document.getElementById('cfgTel').value.trim();
      state.config.cidade = document.getElementById('cfgCidade').value.trim();
      state.config.endereco = document.getElementById('cfgEndereco').value.trim();
      state.config.email = document.getElementById('cfgEmail').value.trim();
      state.config.password = document.getElementById('cfgSenha').value;
      state.config.parceladoPadraoIdx = parseNum(document.getElementById('cfgParceladoPadrao').value) || 0;
      state.config.fornecedores = Array.from(document.querySelectorAll('[data-cfgfornecedor]')).map(inp=>inp.value.trim()).filter(Boolean);
      state.config.theme = document.getElementById('cfgTheme').value;
      state.config.pix.chave = document.getElementById('cfgPix').value.trim();
      state.config.feeCardDefault = { type:document.getElementById('cfgCardType').value, value:document.getElementById('cfgCardVal').value };
      state.config.feeNotaDefault = { type:document.getElementById('cfgNotaType').value, value:document.getElementById('cfgNotaVal').value };
      save.disabled = true; save.textContent = 'Salvando...';
      const ok1 = await saveConfig(); const ok2 = await saveProducts();
      save.disabled = false; save.textContent = 'Salvar ajustes';
      if(ok1 && ok2) toast('Ajustes salvos');
      checkLock(); render();
    });
    const exp = app.querySelector('[data-act=exportarexcel]'); if(exp) exp.addEventListener('click', async ()=>{ exportarDadosExcel(); await marcarBackupFeito(); });
    const expJson = app.querySelector('[data-act=exportarjson]'); if(expJson) expJson.addEventListener('click', async ()=>{ exportarBackupJSON(); await marcarBackupFeito(); });
    const impJson = app.querySelector('#cfgImportBackup'); if(impJson) impJson.addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      if(confirm('Isso vai SUBSTITUIR todos os dados atuais pelos do arquivo de backup. Tem certeza?')){ importarBackupJSON(file); }
      e.target.value = '';
    });
  }
}

/* ---------------- geração de PDF ---------------- */
function pdfHtmlFor(clienteNome, clienteTel, tabelaLabel, sections, subtotal, pct, descontoVal, cardOn, cardVal, notaOn, notaVal, total, installLabel, numero){
  const cfg = state.config;
  pct = pct||0;
  const secsHtml = sections.map(sec=>{
    const rows = sec.items.map(it=>`<tr><td>${escapeHtml(upper(it.name))}</td><td class="r">${parseNum(it.qty)}</td><td class="r">R$ ${money(parseNum(it.price)*(1+pct/100))}</td><td class="r">R$ ${money(parseNum(it.qty)*parseNum(it.price)*(1+pct/100))}</td></tr>`).join('');
    return `<div class="sectitle">${escapeHtml(upper(sec.title))}</div><table><colgroup><col style="width:52%"><col style="width:14%"><col style="width:17%"><col style="width:17%"></colgroup><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody></table><div class="subtot">Subtotal: R$ ${money(sec.items.reduce((s,it)=>s+parseNum(it.qty)*parseNum(it.price)*(1+pct/100),0))}</div>`;
  }).join('');
  const logoImg = cfg.logoDataUrl ? `<img ${'s'+'rc'}="${cfg.logoDataUrl}">` : '';
  return `
    <div class="pdf-head">
      <div class="pdf-head-left">${logoImg}<h1>${escapeHtml(upper(cfg.empresa||'Orçamento'))}</h1></div>
      ${cfg.email?`<div class="pdf-email">${escapeHtml(cfg.email)}</div>`:''}
    </div>
    ${cfg.endereco?`<div class="pdf-addr">${escapeHtml(upper(cfg.endereco))}</div>`:''}
    <div class="pdf-sub">${numero?`<b>Nº ${escapeHtml(numero)}</b> · `:''}${cfg.vendedorNome?escapeHtml(cfg.vendedorNome)+' · ':''}${escapeHtml(cfg.telefone||'')}${cfg.cidade?' · '+escapeHtml(cfg.cidade):''} — ${new Date().toLocaleDateString('pt-BR')}</div>
    <div class="cliente"><b>Cliente:</b> ${escapeHtml(upper(clienteNome))}${clienteTel?' · '+escapeHtml(clienteTel):''}<br><b>Tabela de preço:</b> ${escapeHtml(tabelaLabel)}${installLabel?` · <b>Parcelamento:</b> ${escapeHtml(installLabel)}`:''}</div>
    ${secsHtml}
    <div class="tot-block">
      <div class="tot-line"><span>Subtotal</span><span>R$ ${money(subtotal)}</span></div>
      ${descontoVal>0?`<div class="tot-line"><span>Desconto</span><span>- R$ ${money(descontoVal)}</span></div>`:''}
      ${cardOn?`<div class="tot-line"><span>Taxa do cartão</span><span>R$ ${money(cardVal)}</span></div>`:''}
      ${notaOn?`<div class="tot-line"><span>Valor da nota</span><span>R$ ${money(notaVal)}</span></div>`:''}
      <div class="tot-line grand"><span>TOTAL</span><span>R$ ${money(total)}</span></div>
    </div>
  `;
}

/* ---------------- geração de PDF (desenho direto com jsPDF, sem "fotografar" a tela) ---------------- */
async function gerarPdfBlob(clienteNome, clienteTel, tabelaLabel, sections, subtotal, pct, descontoVal, cardOn, cardVal, notaOn, notaVal, total, installLabel, numero){
  await librariesReady;
  pct = pct||0;
  const cfg = state.config;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 15, pageWidth = 210, rightX = pageWidth - marginX;
  let y = 18;
  function ensureSpace(h){ if(y + h > 282){ doc.addPage(); y = 18; } }

  const hasLogo = !!cfg.logoDataUrl;
  if(hasLogo){ try{ doc.addImage(cfg.logoDataUrl, 'PNG', marginX, y-6, 14, 14); }catch(e){} }
  const textX = hasLogo ? marginX+18 : marginX;

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(43,42,40);
  doc.text(upper(cfg.empresa||'Orçamento'), textX, y);
  if(cfg.email){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,86,77); doc.text(cfg.email, rightX, y, {align:'right'}); }
  y += 6;
  if(cfg.endereco){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,86,77); doc.text(upper(cfg.endereco), textX, y); y += 5; }
  const subParts = [];
  if(numero) subParts.push('Nº '+numero);
  if(cfg.vendedorNome) subParts.push(cfg.vendedorNome);
  if(cfg.telefone) subParts.push(cfg.telefone);
  if(cfg.cidade) subParts.push(cfg.cidade);
  subParts.push(new Date().toLocaleDateString('pt-BR'));
  doc.setFontSize(9); doc.text(subParts.join(' · '), textX, Math.max(y, 24)); y = Math.max(y,24) + 7;

  doc.setDrawColor(210); doc.line(marginX, y, rightX, y); y += 6;

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(43,42,40);
  doc.text('Cliente: ' + upper(clienteNome) + (clienteTel?' · '+clienteTel:''), marginX, y); y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  let tabLine = 'Tabela de preço: '+tabelaLabel;
  if(installLabel) tabLine += ' · Parcelamento: '+installLabel;
  doc.text(tabLine, marginX, y); y += 8;

  sections.forEach(sec=>{
    ensureSpace(15);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(150,100,20);
    doc.text(upper(sec.title), marginX, y); y += 5;
    doc.setFontSize(8); doc.setTextColor(120,115,105); doc.setFont('helvetica','normal');
    doc.text('Item', marginX, y); doc.text('Qtd', marginX+100, y, {align:'right'}); doc.text('Unit.', marginX+130, y, {align:'right'}); doc.text('Total', rightX, y, {align:'right'});
    y += 1.5; doc.setDrawColor(225); doc.line(marginX, y, rightX, y); y += 4.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(43,42,40);
    let secSub = 0;
    sec.items.forEach(it=>{
      const qty = parseNum(it.qty), price = parseNum(it.price)*(1+pct/100), lineTotal = qty*price;
      secSub += lineTotal;
      const nameLines = doc.splitTextToSize(upper(it.name), 90);
      ensureSpace(4.5*nameLines.length + 2);
      doc.text(nameLines, marginX, y);
      doc.text(String(qty), marginX+100, y, {align:'right'});
      doc.text('R$ '+money(price), marginX+130, y, {align:'right'});
      doc.text('R$ '+money(lineTotal), rightX, y, {align:'right'});
      y += 4.5*nameLines.length + 1.5;
    });
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    ensureSpace(8);
    doc.text('Subtotal: R$ '+money(secSub), rightX, y, {align:'right'}); y += 9;
  });

  ensureSpace(45);
  doc.setDrawColor(200); doc.line(marginX, y, rightX, y); y += 7;
  function totLine(label, value, big){
    ensureSpace(7);
    doc.setFont('helvetica', big?'bold':'normal'); doc.setFontSize(big?12.5:10); doc.setTextColor(43,42,40);
    doc.text(label, marginX, y); doc.text(value, rightX, y, {align:'right'});
    y += big?7.5:6;
  }
  totLine('Subtotal', 'R$ '+money(subtotal));
  if(descontoVal>0) totLine('Desconto', '- R$ '+money(descontoVal));
  if(cardOn) totLine('Taxa do cartão', 'R$ '+money(cardVal));
  if(notaOn) totLine('Valor da nota', 'R$ '+money(notaVal));
  doc.setDrawColor(170); doc.line(marginX, y-1.5, rightX, y-1.5); y += 2;
  totLine('TOTAL', 'R$ '+money(total), true);

  return doc.output('blob');
}

/* ---------------- PDF interno: Ordem de Produção (preço de custo, para a fábrica) ---------------- */
async function gerarPdfProducaoBlob(pedido){
  await librariesReady;
  const cfg = state.config;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 15, pageWidth = 210, rightX = pageWidth - marginX;
  let y = 18;
  function ensureSpace(h){ if(y + h > 282){ doc.addPage(); y = 18; } }

  // Faixa de aviso vermelha no topo — bem diferente do PDF do cliente
  doc.setFillColor(178, 40, 40);
  doc.rect(0, 0, pageWidth, 22, 'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('ORDEM DE PRODUÇÃO', marginX, 13);
  doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text('DOCUMENTO INTERNO — NÃO ENVIAR AO CLIENTE (contém preço de custo)', marginX, 19);
  y = 32;

  doc.setTextColor(43,42,40);
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text(`Pedido ${pedido.numero?('Nº '+pedido.numero):''}`, marginX, y);
  doc.text(new Date().toLocaleDateString('pt-BR'), rightX, y, {align:'right'});
  y += 7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text('Cliente (referência): ' + (pedido.clientName||'—'), marginX, y); y += 5;
  const inst = cfg.installments[pedido.installIdx];
  doc.text('Prazo: ' + (pedido.prazoDias||5) + ' dias úteis a partir da conversão em pedido', marginX, y); y += 5;
  if(inst) { doc.text('Parcelamento: ' + inst.vezes + 'x', marginX, y); y += 5; }
  y += 3;
  doc.setDrawColor(210); doc.line(marginX, y, rightX, y); y += 7;

  let custoGeral = 0;
  (pedido.sections||[]).forEach(sec=>{
    ensureSpace(15);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(150,40,30);
    doc.text(upper(sec.title), marginX, y); y += 5;
    doc.setFontSize(8); doc.setTextColor(120,115,105); doc.setFont('helvetica','normal');
    doc.text('Item', marginX, y); doc.text('Fornecedor', marginX+78, y); doc.text('Qtd', marginX+128, y, {align:'right'}); doc.text('Custo unit.', marginX+158, y, {align:'right'}); doc.text('Custo total', rightX, y, {align:'right'});
    y += 1.5; doc.setDrawColor(225); doc.line(marginX, y, rightX, y); y += 4.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(43,42,40);
    let secCusto = 0;
    sec.items.forEach(it=>{
      const qty = parseNum(it.qty), custo = parseNum(it.cost||0), lineCusto = qty*custo;
      secCusto += lineCusto; custoGeral += lineCusto;
      const prod = it.productId ? state.products.find(x=>x.id===it.productId) : null;
      const fornecedor = prod ? (prod.fornecedor||'—') : '—';
      const nameLines = doc.splitTextToSize(upper(it.name), 60);
      ensureSpace(4.5*nameLines.length + 2);
      doc.text(nameLines, marginX, y);
      doc.text(fornecedor, marginX+78, y);
      doc.text(String(qty), marginX+128, y, {align:'right'});
      doc.text('R$ '+money(custo), marginX+158, y, {align:'right'});
      doc.text('R$ '+money(lineCusto), rightX, y, {align:'right'});
      y += 4.5*nameLines.length + 1.5;
    });
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    ensureSpace(8);
    doc.text('Custo da seção: R$ '+money(secCusto), rightX, y, {align:'right'}); y += 9;
  });

  ensureSpace(20);
  doc.setDrawColor(178,40,40); doc.setLineWidth(0.6); doc.line(marginX, y, rightX, y); doc.setLineWidth(0.2); y += 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(178,40,40);
  doc.text('CUSTO TOTAL DE PRODUÇÃO', marginX, y);
  doc.text('R$ '+money(custoGeral), rightX, y, {align:'right'});

  return doc.output('blob');
}

function mostrarPdfPreview(htmlContent, filename, clienteNome, clienteTel, pdfArgs){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg fullscreen" id="mbg">
    <div class="modal fsmodal">
      <div class="modal-head" style="margin-bottom:6px;"><h3 style="font-size:13px;">📸 Tire o print aqui</h3><button id="mclose">✕</button></div>
      <div id="previewScroll"><div class="pdf-doc" id="pdfDocLive">${htmlContent}</div></div>
      <div class="row" style="margin-top:8px;">
        <a id="btnBaixar" class="btn-ghost btn-block btn-sm" style="opacity:.5;pointer-events:none;">Preparando PDF...</a>
        <button id="btnShare" class="btn-primary btn-block btn-sm" disabled>Preparando...</button>
      </div>
    </div>
  </div>`;
  document.getElementById('mclose').onclick = closeModal;

  const sourceEl = document.getElementById('pdfDocLive');
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
  gerarPdfBlob(...pdfArgs).then(blob=>{
    const url = URL.createObjectURL(blob);
    const btnBaixar = document.getElementById('btnBaixar');
    const btnShare = document.getElementById('btnShare');
    if(!btnBaixar || !btnShare) return; // modal já foi fechado
    btnBaixar.href = url; btnBaixar.setAttribute('download', filename); btnBaixar.target = '_blank'; btnBaixar.rel = 'noopener';
    btnBaixar.style.opacity=''; btnBaixar.style.pointerEvents=''; btnBaixar.textContent = '⬇ Abrir / Baixar PDF';
    btnShare.disabled = false; btnShare.textContent = '📤 Enviar / Compartilhar PDF';
    btnShare.onclick = async ()=>{
      const file = new File([blob], filename, {type:'application/pdf'});
      try{
        if(navigator.canShare && navigator.canShare({files:[file]})){
          // abre o menu nativo do celular (WhatsApp, e-mail, impressora, visualizador de PDF...)
          await navigator.share({files:[file], title:'Orçamento', text:`Orçamento - ${clienteNome}`});
          return;
        }
      }catch(e){ return; /* usuário cancelou o menu de compartilhar */ }
      // sem suporte ao menu nativo: aciona o mesmo link de abrir/baixar (mais confiável que abrir popup)
      toast('Abrindo o PDF...');
      btnBaixar.click();
    };
  }).catch(err=>{
    const btnBaixar = document.getElementById('btnBaixar');
    const btnShare = document.getElementById('btnShare');
    if(btnBaixar){ btnBaixar.textContent = 'PDF indisponível — use o print'; }
    if(btnShare){ btnShare.textContent = 'Envie o print pelo WhatsApp'; btnShare.disabled=false; btnShare.onclick = ()=>{ window.open('https://wa.me/','_blank'); }; }
  });
  }));
}

function gerarEMostrarPdf(clienteNome, clienteTel, htmlContent, pdfArgs){
  const filename = `orcamento-${clienteNome.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.pdf`;
  mostrarPdfPreview(htmlContent, filename, clienteNome, clienteTel, pdfArgs);
}

async function gerarPDF(){
  const b = state.budget; const cfg = state.config;
  let clienteNome="", clienteTel="";
  if(b.clientId==='avulso'){ clienteNome=b.clientAvulsoNome; clienteTel=b.clientAvulsoTel; }
  else if(b.clientId){ const c = state.clients.find(c=>c.id===b.clientId); if(c){ clienteNome=c.name; clienteTel=c.phone; } }
  if(!clienteNome){ toast('Selecione ou digite um cliente antes de gerar o PDF'); return; }
  const hasItems = b.sections.some(s=>s.items.length>0);
  if(!hasItems){ toast('Adicione ao menos um item ao orçamento'); return; }

  const t = calcTotals(b);
  const inst = cfg.installments[b.installIdx];
  const installLabel = inst ? `${inst.vezes}x${t.parcelPercentRaw?(b.parcelamentoOn!==false?` (+${t.parcelPercentRaw}% já incluso)`:' (sem acréscimo)'):''}` : '';

  // salva/atualiza como pedido (status orçamento, a menos que já esteja mais avançado) — feito antes pra já ter o número
  const pedido = buildPedidoFromBudget(b.editingId);
  if(b.editingId){ const idx = state.pedidos.findIndex(p=>p.id===b.editingId); if(idx>-1) state.pedidos[idx]=pedido; else state.pedidos.push(pedido); }
  else state.pedidos.push(pedido);
  savePedidos();

  const htmlContent = pdfHtmlFor(clienteNome, clienteTel, cfg.priceLabels[b.priceIdx], b.sections, t.subtotal, t.parcelPercent, t.desconto, b.cardFee.on, t.card, b.notaFee.on, t.nota, t.total, installLabel, pedido.numero);
  const pdfArgs = [clienteNome, clienteTel, cfg.priceLabels[b.priceIdx], b.sections, t.subtotal, t.parcelPercent, t.desconto, b.cardFee.on, t.card, b.notaFee.on, t.nota, t.total, installLabel, pedido.numero];

  gerarEMostrarPdf(clienteNome, clienteTel, htmlContent, pdfArgs);
  state.budget = newBudget();
}

function gerarPDFdePedido(p){
  const cfg = state.config;
  const inst = cfg.installments[p.installIdx];
  const pct = p.parcelPercent||0;
  const installLabel = inst ? `${inst.vezes}x${pct?` (+${pct}% já incluso)`:''}` : '';
  const t = { subtotal:p.subtotal, desconto:0, card:0, nota:0, total:p.total };
  const base = p.subtotal;
  if(p.discount && p.discount.on){
    const val = parseNum(p.discount.value);
    if(p.discount.type==='%') t.desconto = base*val/100;
    else if(p.discount.type==='fixo') t.desconto = val;
    else if(p.discount.type==='final') t.desconto = base-val;
    if(t.desconto<0) t.desconto=0; if(t.desconto>base) t.desconto=base;
  }
  const baseComDesconto = base - t.desconto;
  if(p.cardFee && p.cardFee.on) t.card = p.cardFee.type==='%' ? baseComDesconto*parseNum(p.cardFee.value)/100 : parseNum(p.cardFee.value);
  if(p.notaFee && p.notaFee.on) t.nota = p.notaFee.type==='%' ? baseComDesconto*parseNum(p.notaFee.value)/100 : parseNum(p.notaFee.value);
  const htmlContent = pdfHtmlFor(p.clientName, p.clientPhone, cfg.priceLabels[p.priceIdx]||'', p.sections, p.subtotal, pct, t.desconto, p.cardFee&&p.cardFee.on, t.card, p.notaFee&&p.notaFee.on, t.nota, p.total, installLabel, p.numero);
  const pdfArgs = [p.clientName, p.clientPhone, cfg.priceLabels[p.priceIdx]||'', p.sections, p.subtotal, pct, t.desconto, p.cardFee&&p.cardFee.on, t.card, p.notaFee&&p.notaFee.on, t.nota, p.total, installLabel, p.numero];
  gerarEMostrarPdf(p.clientName||'pedido', p.clientPhone, htmlContent, pdfArgs);
}

/* ================= exportar backup (Excel) ================= */
function exportarDadosExcel(){
  if(typeof XLSX === 'undefined'){ toast('Não consegui carregar o Excel — verifique a internet e tente de novo'); return; }
  const labels = state.config.priceLabels;
  const prodRows = state.products.map(p=>{
    const row = { Nome:p.name, Custo:p.cost||0 };
    labels.forEach((l,i)=>{ row[l] = p.prices[i]||0; });
    return row;
  });
  const cliRows = state.clients.map(c=>({ Nome:c.name, Telefone:c.phone||'', Endereco:c.address||'' }));
  const pedRows = state.pedidos.map(p=>({
    Data: new Date(p.createdAt).toLocaleDateString('pt-BR'),
    Cliente: p.clientName||'',
    Telefone: p.clientPhone||'',
    Status: STATUS_LABEL[p.status]||p.status,
    Subtotal: p.subtotal||0,
    Custo: p.custoTotal||0,
    Margem: p.margem||0,
    'Margem %': p.margemPercent? Number(p.margemPercent.toFixed(1)) : 0,
    Total: p.total||0
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodRows), 'Produtos');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cliRows), 'Clientes');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pedRows), 'Pedidos');
  const filename = `backup-orcamentos-${new Date().toISOString().slice(0,10)}.xlsx`;
  try{ XLSX.writeFile(wb, filename); toast('Backup exportado!'); }
  catch(e){ toast('Não consegui exportar agora, tenta de novo'); }
}

function baixarArquivoTexto(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
}

function exportarBackupJSON(){
  const payload = {
    tipo: 'backup-orcamento-textura', exportedAt: new Date().toISOString(),
    config: state.config, products: state.products, clients: state.clients,
    pedidos: state.pedidos, templates: state.templates
  };
  const filename = `backup-completo-orcamentos-${todayStr()}.json`;
  try{ baixarArquivoTexto(JSON.stringify(payload, null, 2), filename, 'application/json'); toast('Backup completo baixado!'); }
  catch(e){ toast('Não consegui gerar o backup agora'); }
}

async function importarBackupJSON(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data!=='object') throw new Error('formato inválido');
      if(data.config) state.config = Object.assign(state.config, data.config);
      if(Array.isArray(data.products)) state.products = data.products;
      if(Array.isArray(data.clients)) state.clients = data.clients;
      if(Array.isArray(data.pedidos)) state.pedidos = data.pedidos;
      if(Array.isArray(data.templates)) state.templates = data.templates;
      await Promise.all([saveConfig(), saveProducts(), saveClients(), savePedidos(), saveTemplates()]);
      toast('Backup restaurado com sucesso!');
      checkBackupGate(); checkLock(); render();
    }catch(e){ toast('Arquivo inválido — confira se é um backup gerado por este programa'); }
  };
  reader.onerror = ()=> toast('Não consegui ler esse arquivo');
  reader.readAsText(file);
}
